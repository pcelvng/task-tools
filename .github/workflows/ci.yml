name: CI

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pull after Hub login so anonymous rate limits do not block CI.
      # alpine/minio pins the Oct 2025 release (CVE-2025-62506); official
      # minio/minio images stopped publishing after 2025-09.
      # Use /tmp/data: the image runs non-root and cannot write the default /data VOLUME.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            alpine/minio:RELEASE.2025-10-15T17-29-55Z \
            server /tmp/data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO failed to become ready" >&2
          docker logs minio
          exit 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          go test -cover -v -coverprofile=coverage.out -covermode=atomic ./... ./apps/...
          go tool cover -func=coverage.out | tail -1
          go tool cover -html=coverage.out -o=cover.html

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            cover.html

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: make docker
